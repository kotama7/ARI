schema_version: 1
# source.package_sha256 is canonical_digest({package-relative path:
# bytes_digest(blob)}) over every git-tracked file of the package at
# source.full_commit_sha. The previous values predate this definition and
# were not reproducible from the repository; these are.
catalog_source_revision: ari-provider-catalog/3
source_of_truth: existing-skill-manifests-and-SKILLS.lock
