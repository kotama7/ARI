      full_commit_sha: 929a682fa0f41a1b416f9615e35506b6538a54a4
      package_sha256: sha256:3f05941c40043d0b9ecbf008fa436fb6ee058e59a119cfff4fb85a3f1dca5479
      license: MIT
    manifest_sha256: sha256:2f2cba035b0aa931ebd584b0de49e029340ac001919c0fea64e990adc0395fab
    declared_capability_refs_by_tool:
      emit_results: [ari.result.emit/v1]
      read_file: [ari.code.inspect/v1, ari.data.read/v1]
      run_bash: [ari.execution.benchmark/v1, ari.execution.compile/v1, ari.execution.run/v1]
      run_code: [ari.execution.benchmark/v1, ari.execution.run/v1]
