      package_sha256: sha256:69343dded7ccad76663384659f0f675df9d4199fb04a53f9ef81a6bb4508461b
      license: MIT
    manifest_sha256: sha256:76fe7760e327d4bf2f20e9ae8dd026639d2d76fd14aa9a6803046bcdccdabf79
    declared_capability_refs_by_tool:
      container_submit: [ari.execution.slurm-submit/v1]
      job_submit: [ari.execution.slurm-submit/v1]
