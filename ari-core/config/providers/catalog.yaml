      full_commit_sha: d303a4ca15ca1c5b6df0993b6ec13cb02d3ca34b
      package_sha256: sha256:f594631048811eed329012b55f2ccf3fa90397a2e2c37c9b0e47727075c6ad45
      license: MIT
    manifest_sha256: sha256:2f0b1bfcf99dc4e07c3859b0882caa575ec5e52df51e1619c89808ce1efd9e64
    declared_capability_refs_by_tool: {}
notes:
  - Provider launch identity remains in skill.yaml and live tool identity remains in SKILLS.lock.
  - This catalog stores reviewed semantic projections only; it never repeats entrypoints or schemas.
  - manifest_sha256 is the only field the loader verifies; a package edit that leaves the manifest
    untouched does not fail the load, so source.* must be re-pinned deliberately after a package change.
  - An entry that federates third-party instruments may add an optional `brokered` block with
    `catalog_lock` (path relative to this file), `dispatch_tool` (a tool name in the run lock), and
    `declared_capability_refs_by_brokered_tool` (leaf tool_ref -> ARI capability refs). The loader
    re-authenticates the federated lock and emits composite provisions; see
    docs/reference/knowledge_capability_assurance.md.
  - >-
    The tool-registry entry is inert until two things are true. tool-registry-skill must be in the
    run's skills config so it reaches SKILLS.lock, and ARI_TOOL_REGISTRY_LOCK must point at a
    materialized catalog. The packaged CATALOG.lock is empty on purpose -- a real one records
    absolute local paths. Both ARI and the broker read that variable, so they cannot disagree
    about which lock is in force.
