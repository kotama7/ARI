schema_version: ari.harness-target-interface/v1
id: gemm-c-abi/v1
target_kind: shared-library
symbols:
  - ari_gemm_f32
  - ari_gemm_f64
return_contract: zero on success; nonzero means interface/input rejection
arguments:
  - m,n,k: signed nonnegative dimensions
  - transpose_a,transpose_b: zero or one
  - lda,ldb,ldc: row-major leading dimensions
  - alpha,beta: dtype scalar
  - a,b,c: input A/B and in-out C buffers
  - thread_count: requested positive thread count
semantics: C := alpha * op(A) * op(B) + beta * C
dtype_suffixes:
  f32: IEEE-754 binary32
  f64: IEEE-754 binary64
authority: interface-only
