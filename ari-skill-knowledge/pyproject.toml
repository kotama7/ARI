[project]
name = "ari-skill-knowledge"
version = "0.1.0"
description = "Read-only ARI Knowledge Skill query Provider"
requires-python = ">=3.13"
dependencies = ["ari-core>=0.8.0", "mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
