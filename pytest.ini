[pytest]
# importlib import mode lets test modules across the repo share basenames
# (multiple test_server.py / test_memory.py) without colliding on the
# default "prepend" sys.path packaging.
addopts = --import-mode=importlib

# Default testpath: ari-core/tests is the in-process safe set.
#
# Each ari-skill-* package ships its own ``src/server.py``. Importing
# ``from src.server import …`` (or ``from server import …``) across two
# skills in the same Python process is fundamentally ambiguous —
# ``sys.modules`` caches the first skill's module and downstream
# ``unittest.mock.patch("src.server.X")`` calls then target the wrong
# module.
#
# **Full suite**: run ``bash scripts/run_all_tests.sh`` to execute each
# skill in its own pytest process. Each skill's tests can also be run
# standalone via ``pytest ari-skill-<name>/tests`` from the repo root.
#
# ``workspace/harnesses`` is here because the registered harnesses pin the
# SCORING contract — the denominator, the measured environment, the
# per-compiler flags — and a bare ``pytest`` at the repo root collected
# none of them. A green run then said nothing about whether scoring still
# measured what it claimed to, which is the one thing a published number
# depends on. They are standalone modules with no ``src.server``, so they
# carry none of the in-process ambiguity above; verified by collecting
# both paths in one process. The path is the harnesses ROOT, not its
# shared ``tests/`` directory: each task also ships its own ``tests/``.
# Absent on a checkout without a workspace, which pytest tolerates.
testpaths =
    ari-core/tests
    workspace/harnesses
asyncio_mode = auto
