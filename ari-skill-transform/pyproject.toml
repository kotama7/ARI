[project]
name = "ari-skill-transform"
version = "0.2.0"
description = "Digest-bound scientific data and Experiment Analysis Report MCP server"
requires-python = ">=3.10"
dependencies = [
    "ari-core>=0.9.1",
    "litellm>=1.91.0",
    "mcp>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
