[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ari-skill-orchestrator"
version = "2.0.0"
description = "Durable authenticated MCP control plane for ARI experiment runs"
requires-python = ">=3.10"
dependencies = [
    "ari-core>=0.9.1",
    "mcp>=1.28.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../ari-core"]
