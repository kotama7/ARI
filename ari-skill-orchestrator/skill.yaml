schema_version: 1
name: ari-orchestrator
package: ari-skill-orchestrator
version: 1.0.0
display_name: Control ARI runs
description: External asynchronous control and inspection of ARI experiment runs.
enabled_by_default: false
environment_policy: complete
entrypoint:
  transport: stdio
  command_kind: python
  module: src/server.py
required_env: []
optional_env:
  - ARI_BACKEND
  - ARI_EXECUTOR
  - ARI_MAX_RECURSION_DEPTH
  - ARI_MODEL
  - ARI_ORCHESTRATOR_DRY_RUN
  - ARI_ORCHESTRATOR_LOGS
  - ARI_ORCHESTRATOR_PORT
  - ARI_ORCHESTRATOR_SSE_ONESHOT
  - ARI_ORCHESTRATOR_SSE_TIMEOUT
  - ARI_PARENT_RUN_ID
  - ARI_RETRIEVAL_BACKEND
  - ARI_WORKSPACE
  - AWS_DEFAULT_REGION
  - AWS_REGION
  - AZURE_API_BASE
  - AZURE_API_VERSION
  - LLM_API_BASE
  - OLLAMA_HOST
  - VERTEXAI_LOCATION
  - VERTEXAI_PROJECT
credential_scopes:
  - id: model.provider
    optional_env:
      - ANTHROPIC_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AZURE_API_KEY
      - AZURE_OPENAI_API_KEY
      - COHERE_API_KEY
      - DATABRICKS_API_TOKEN
      - DEEPINFRA_API_KEY
      - DEEPSEEK_API_KEY
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - GROQ_API_KEY
      - MISTRAL_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - REPLICATE_API_TOKEN
      - TOGETHERAI_API_KEY
      - VERTEXAI_CREDENTIALS
      - WATSONX_APIKEY
      - XAI_API_KEY
tool_defaults:
  phases: [control]
  side_effects: read-only
  determinism: live-data
  timeout_class: bounded
  permissions: [workspace-read]
  result_schema: ari.result-envelope/v1
tools:
  - name: get_ear
    capability_ref: ari.control.ear.read
  - name: get_paper
    capability_ref: ari.control.paper.read
  - name: get_status
    capability_ref: ari.control.run.status
  - name: get_workflow
    capability_ref: ari.control.workflow.read
  - name: list_children
    capability_ref: ari.control.run.children
  - name: list_files
    capability_ref: ari.control.files.list
  - name: list_runs
    capability_ref: ari.control.runs.list
  - name: list_skills
    capability_ref: ari.control.skills.list
  - name: read_file
    capability_ref: ari.control.file.read
  - name: run_experiment
    capability_ref: ari.control.run.start
    side_effects: stateful
    timeout_class: async
    permissions: [workspace-read, workspace-write, process]
  - name: stop_experiment
    capability_ref: ari.control.run.stop
    side_effects: destructive
    permissions: [workspace-read, process]
