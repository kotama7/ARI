[project]
name = "ari-skill-harness"
version = "0.1.0"
description = "Read-only ARI Harness and Scientific Assurance query Provider"
requires-python = ">=3.13"
dependencies = ["ari-core>=0.8.0", "mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
