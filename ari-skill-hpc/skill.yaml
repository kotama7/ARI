schema_version: 1
name: hpc-skill
package: ari-skill-hpc
version: 0.1.0
display_name: Run HPC workloads
description: SLURM lifecycle, platform probes, and Singularity execution for research workloads.
environment_policy: complete
entrypoint:
  transport: stdio
  command_kind: python
  module: src/server.py
required_env: []
optional_env:
  - ARI_CHECKPOINT_DIR
  - ARI_PROBE_TOOLS
  - ARI_SBATCH_EXPORT_MODE
  - ARI_SLURM_CPUS
  - ARI_SLURM_GPUS
  - ARI_SLURM_MEM_GB
  - ARI_SLURM_PARTITION
  - ARI_WORK_DIR
  - SLURM_DEFAULT_PARTITION
  - SLURM_DEFAULT_WORK_DIR
  - SLURM_LOG_DIR
  - SLURM_MODE
  - SLURM_SSH_HOST
  - SLURM_SSH_PORT
  - SLURM_SSH_USER
  - SLURM_VALID_PARTITIONS
credential_scopes:
  - id: scheduler.ssh
    optional_env: [SLURM_SSH_KEY, SLURM_SSH_PASSWORD]
  - id: scheduler.exported-environment
    optional_env: [ARI_ENV_FILE, ARI_ROOT]
tool_defaults:
  phases: [bfts, reproduce]
  side_effects: stateful
  determinism: live-data
  timeout_class: slow
  permissions: [workspace-read, workspace-write, process, scheduler]
  result_schema: ari.result-envelope/v1
tools:
  - name: job_cancel
    capability_ref: ari.hpc.job.cancel
    side_effects: destructive
  - name: job_status
    capability_ref: ari.hpc.job.status
    side_effects: read-only
    timeout_class: bounded
    permissions: [scheduler]
  - name: probe_platform_capabilities
    capability_ref: ari.hpc.platform.probe
    side_effects: read-only
    timeout_class: bounded
  - name: singularity_build
    capability_ref: ari.container.singularity.build
  - name: singularity_build_fakeroot
    capability_ref: ari.container.singularity.build
  - name: singularity_pull
    capability_ref: ari.container.singularity.pull
  - name: singularity_run
    capability_ref: ari.container.singularity.run
  - name: singularity_run_gpu
    capability_ref: ari.container.singularity.run-gpu
  - name: slurm_submit
    capability_ref: ari.hpc.job.submit
    timeout_class: async
    async_lifecycle:
      handle_field: job_id
      state_field: status
      status:
        capability_ref: ari.hpc.job.status
        handle_argument: job_id
      result:
        capability_ref: ari.hpc.job.status
        handle_argument: job_id
      cancel:
        capability_ref: ari.hpc.job.cancel
        handle_argument: job_id
      states:
        submitted_states: [submitted, PENDING, CONFIGURING, UNKNOWN]
        running_states: [RUNNING, COMPLETING]
        succeeded_states: [COMPLETED]
        failed_states: [FAILED, TIMEOUT, NODE_FAIL, OUT_OF_MEMORY, PREEMPTED, BOOT_FAIL]
        cancelled_states: [CANCELLED, CANCELED]
      poll_interval_seconds: 30
      max_wait_seconds: 172800
