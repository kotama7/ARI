schema_version: 1
name: hpc-skill
package: ari-skill-hpc
version: 0.3.1
display_name: Run reproducible HPC workloads
description: Typed SLURM lifecycle, strict SSH transport, capability probes, and digest-pinned containers.
environment_policy: complete
entrypoint:
  transport: stdio
  command_kind: python
  module: ari_skill_hpc/server.py
required_env: []
optional_env:
  - ARI_CHECKPOINT_DIR
  # Site policy: the set of nodes this scheduler may place work on. Held in the
  # environment because node names are site identity and are not carried here.
  - ARI_HPC_ALLOWED_NODES
  - ARI_HPC_LEDGER_PATH
  - ARI_PROBE_TOOLS
  - ARI_SCHEDULER_PATH
  - ARI_SLURM_CPUS
  - ARI_SLURM_GPUS
  - ARI_SLURM_MEM_GB
  - ARI_SLURM_PARTITION
  - ARI_WORK_DIR
  - SLURM_COMMAND_TIMEOUT
  - SLURM_DEFAULT_PARTITION
  - SLURM_DEFAULT_WORK_DIR
  - SLURM_LOG_DIR
  - SLURM_MODE
  - SLURM_SHARED_FILESYSTEM
  - SLURM_SSH_CONNECT_TIMEOUT
  - SLURM_SSH_HOST
  - SLURM_SSH_KNOWN_HOSTS
  - SLURM_SSH_PORT
  - SLURM_SSH_USER
credential_scopes:
  - id: scheduler.ssh
    optional_env: [SLURM_SSH_KEY, SLURM_SSH_PASSWORD]
tool_defaults:
  phases: [bfts, reproduce]
  side_effects: stateful
  determinism: live-data
  timeout_class: slow
  permissions: [workspace-read, workspace-write, process, scheduler]
  result_schema: ari.result-envelope/v1
tools:
  - name: job_submit
    capability_ref: ari.hpc.job.submit
    description: Submit a typed, idempotent JobRequestV1.
    timeout_class: async
    async_lifecycle: &canonical_job_lifecycle
      handle_field: handle_id
      state_field: state
      status:
        capability_ref: ari.hpc.job.status
        handle_argument: handle_id
      result:
        capability_ref: ari.hpc.job.result
        handle_argument: handle_id
      cancel:
        capability_ref: ari.hpc.job.cancel
        handle_argument: handle_id
      states:
        submitted_states: [submitted]
        running_states: [running]
        succeeded_states: [succeeded]
        failed_states: [failed]
        cancelled_states: [cancelled]
      poll_interval_seconds: 30
      max_wait_seconds: 172800
  - name: container_submit
    capability_ref: ari.hpc.container.submit
    description: Submit a digest-pinned container JobRequestV1.
    timeout_class: async
    async_lifecycle: *canonical_job_lifecycle
  - name: job_status
    capability_ref: ari.hpc.job.status
    description: Read provider-neutral scheduler state.
    side_effects: read-only
    timeout_class: bounded
    permissions: [scheduler]
  - name: job_result
    capability_ref: ari.hpc.job.result
    description: Rehash and publish a terminal JobResultV1.
    side_effects: workspace-write
    timeout_class: bounded
    permissions: [workspace-read, workspace-write, scheduler]
  - name: job_logs
    capability_ref: ari.hpc.job.logs
    description: Read bounded digest-bound job logs.
    side_effects: read-only
    timeout_class: bounded
    permissions: [workspace-read, scheduler]
  - name: job_cancel
    capability_ref: ari.hpc.job.cancel
    description: Request scheduler cancellation.
    side_effects: destructive
    timeout_class: bounded
    permissions: [scheduler]
  - name: probe_platform_capabilities
    capability_ref: ari.hpc.platform.probe
    description: Probe a compute partition and atomically cache its capability record.
    # The probe allocates a bounded job through the scheduler, so its authority
    # is scheduler-submit, not workspace-write. Declaring the lower class let a
    # caller holding only workspace authority cause a scheduler allocation.
    side_effects: stateful
    timeout_class: bounded
    permissions: [workspace-read, workspace-write, process, scheduler]
  - name: slurm_submit
    capability_ref: ari.hpc.legacy.slurm-submit
    description: Compatibility bridge for the core agent batch-script workflow.
    timeout_class: async
    async_lifecycle:
      <<: *canonical_job_lifecycle
      result:
        capability_ref: ari.hpc.job.status
        handle_argument: handle_id
