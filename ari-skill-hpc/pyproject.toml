[project]
name = "ari-skill-hpc"
version = "0.3.0"
description = "Typed reproducible HPC jobs with SLURM and digest-pinned containers"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0",
    "paramiko>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ari-skill-hpc = "ari_skill_hpc.server:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ari_skill_hpc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
