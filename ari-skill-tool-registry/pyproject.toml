[project]
name = "ari-skill-tool-registry"
version = "0.3.0"
description = "Provider-neutral scientific MCP catalog federation for ARI"
requires-python = ">=3.13"
dependencies = [
    "ari-skill-hpc>=0.3.0",
    "jsonschema>=4.23",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
qiskit-local = [
    "qiskit==2.5.1",
    "qiskit-aer==0.17.2",
    "qiskit-mcp-server==0.3.1",
]
qiskit-runtime = [
    "qiskit==2.5.1",
    "qiskit-ibm-runtime==0.48.0",
    "qiskit-mcp-server==0.3.1",
    "qiskit-ibm-runtime-mcp-server==0.6.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
