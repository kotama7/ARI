[project]
name = "ari-skill-tool-registry"
version = "0.1.0"
description = "Provider-neutral scientific MCP catalog federation for ARI"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.23",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
