[project]
name = "ari-skill-web"
version = "0.2.0"
description = "Provenance-preserving web and literature retrieval MCP server"
requires-python = ">=3.10"
dependencies = [
    "ari-core>=0.9.1",
    "arxiv>=2.0",
    "beautifulsoup4>=4.12",
    "ddgs>=9.0",
    "httpx>=0.25",
    "litellm>=1.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
