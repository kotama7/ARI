# Generated by the harness relocation. The measurement scaffolding is
# content-addressed: load() verifies every pin before binding the harness,
# so a modified file refuses to score instead of scoring differently.

[harness]
entry = "stencil_harness.py"
# target/scale are kept for registry compatibility with old checkpoints. The
# current handoff study ranks speedup tasks by native valid_geomean_speedup, not
# by a target-normalized or clamped score.
target = 64.0
target_env = "ARI_STENCIL_TARGET"
axis = "speedup"
scale = "log"

# Reproduces the pre-relocation call EXACTLY. Not uniform across tasks:
# every measure_node accepts (work_dir, *, seed=0), so a uniform call
# type-checks and silently measures something else.
[measure_kwargs]
seed = {env = "ARI_SEED", default = 0}

[declares]
question = "time to solution on a bandwidth-bound sweep, against a competent frozen reference"
denominator = "anchor_matched"
resolves = 0.00149
resolves_measured_on = "2026-08-03"
resolves_reps = 15
cost_s = 97.7
requires = ["c_compiler", "openmp"]
# The candidate allocates its own 268 MB and first-touches it INSIDE the timed
# window, which is why this is the only registered harness where the large-page
# policy reaches the measurement (measured: 5.9x).
sees = ["memory_bandwidth", "numa_first_touch", "large_page_policy",
        "temporal_blocking", "toolchain"]
blind_to = ["problem_generation"]

# The band was measured on the DEFAULT shapes. ARI_STENCIL_SHAPES can
# replace the scored problem without moving a pinned byte or the
# manifest hash, so the value it was measured under is named here and
# a run that differs can be refused instead of quietly inheriting a
# band from a problem it is not measuring.
[declares.band_conditions]
ARI_STENCIL_SHAPES = ""

