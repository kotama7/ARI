# Generated by the harness relocation. The measurement scaffolding is
# content-addressed: load() verifies every pin before binding the harness,
# so a modified file refuses to score instead of scoring differently.

[harness]
entry = "stencil_harness.py"
# target/scale are kept for registry compatibility with old checkpoints. The
# current handoff study ranks speedup tasks by native valid_geomean_speedup, not
# by a target-normalized or clamped score.
target = 64.0
target_env = "ARI_STENCIL_TARGET"
axis = "speedup"
scale = "log"

# Reproduces the pre-relocation call EXACTLY. Not uniform across tasks:
# every measure_node accepts (work_dir, *, seed=0), so a uniform call
# type-checks and silently measures something else.
[measure_kwargs]
seed = {env = "ARI_SEED", default = 0}

