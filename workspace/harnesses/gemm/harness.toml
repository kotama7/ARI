# Generated by the harness relocation. The measurement scaffolding is
# content-addressed: load() verifies every pin before binding the harness,
# so a modified file refuses to score instead of scoring differently.

[harness]
entry = "gemm_harness.py"
# target/scale are kept for registry compatibility with old checkpoints. The
# current handoff study ranks speedup tasks by native valid_geomean_speedup, not
# by a target-normalized or clamped score.
target = 4096.0
target_env = "ARI_GEMM_TARGET"
axis = "speedup"
scale = "log"

[declares]
question = "time to solution on fixed shapes, against a competent frozen reference"
denominator = "anchor_matched"
resolves = 0.00251
resolves_measured_on = "2026-08-03"
resolves_reps = 15
cost_s = 13.1
requires = ["c_compiler", "openmp"]
sees = ["cache_blocking", "vectorisation", "thread_scaling", "toolchain"]
# The problem arrives from outside the timed window, so the candidate never
# allocates or first-touches it under measurement. Measured consequence: the
# large-page policy that moves the stencil 5.9x leaves this harness inside its
# own noise.
blind_to = ["large_page_policy", "numa_first_touch", "problem_generation"]

