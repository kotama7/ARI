<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1450" role="img" aria-labelledby="title desc">
  <title id="title">Constitutional ARI-RQGM 完整审计网络</title>
  <desc id="desc">列出标准模式二十个及论文模式新增三个可问责的登记组件，并把逐节点对抗审查、纪元边界的证据整理、动议、辩护、裁决、内核自审计、登记转换、影响修复和最终主张验证连接为一个网络。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".065"/></pattern>
    <linearGradient id="headGlow" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset=".55" stop-color="#2563eb" stop-opacity=".1"/><stop offset="1" stop-color="#a855f7" stop-opacity=".16"/></linearGradient>
    <marker id="evidenceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#22d3ee"/></marker>
    <marker id="auditArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fb7185"/></marker>
    <marker id="processArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c084fc"/></marker>
    <marker id="enforceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34d399"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;fill:#f1f5f9}.mono{font-family:"IBM Plex Mono","Noto Sans Mono CJK SC",monospace}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:.18em;fill:#67e8f9}.title{font-size:38px;font-weight:750}.subtitle{font-size:16px;fill:#94a3b8}
      .panelTitle{font-size:20px;font-weight:700}.bandTitle{font-size:17px;font-weight:700;letter-spacing:.03em}.groupTitle{font-size:14px;font-weight:700}
      .nodeTitle{font-size:15px;font-weight:700}.body{font-size:13px;fill:#cbd5e1}.small{font-size:11.5px;fill:#94a3b8}.tiny{font-size:10.7px;fill:#94a3b8}
      .chip{font-size:12.2px;font-weight:650}.edgeLabel{font-size:11.5px;font-weight:700}.number{font-size:12px;font-weight:700}
      .evidence{fill:none;stroke:#22d3ee;stroke-width:2;marker-end:url(#evidenceArrow)}.evidenceDash{fill:none;stroke:#22d3ee;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#evidenceArrow)}
      .audit{fill:none;stroke:#fb7185;stroke-width:2.2;marker-end:url(#auditArrow)}.process{fill:none;stroke:#c084fc;stroke-width:2;marker-end:url(#processArrow)}
      .processDash{fill:none;stroke:#c084fc;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#processArrow)}.enforce{fill:none;stroke:#34d399;stroke-width:2.2;marker-end:url(#enforceArrow)}
    </style>
  </defs>
  <rect width="1900" height="1450" fill="#04060c"/><rect width="1900" height="1450" fill="url(#grid)"/>
  <circle cx="1760" cy="90" r="270" fill="#2563eb" opacity=".07"/><circle cx="70" cy="1370" r="250" fill="#22d3ee" opacity=".045"/>

  <text x="50" y="48" class="eyebrow mono">CONSTITUTIONAL ARI-RQGM · COMPLETE AUDIT NETWORK</text>
  <text x="50" y="94" class="title">一张图追踪所有审计者、对象、证据与裁决</text>
  <text x="50" y="128" class="subtitle">左侧是全部可问责的登记组件；右侧是把每项输出变为证据，并送回审计、辩护、裁决和制度变更的程序网络。</text>
  <rect x="1260" y="34" width="590" height="104" rx="14" fill="#08111d" stroke="#334155"/>
  <text x="1282" y="59" class="groupTitle" fill="#a5f3fc">箭头图例</text>
  <line x1="1284" y1="83" x2="1344" y2="83" class="evidence"/><text x="1354" y="87" class="small">证据／记录</text>
  <line x1="1460" y1="83" x2="1520" y2="83" class="audit"/><text x="1530" y="87" class="small">审计／动议</text>
  <line x1="1638" y1="83" x2="1698" y2="83" class="process"/><text x="1708" y="87" class="small">辩护／裁决</text>
  <line x1="1284" y1="113" x2="1344" y2="113" class="enforce"/><text x="1354" y="117" class="small">固定规则执行</text>
  <text x="1530" y="117" class="small">分区标题＝时点 ／ 节点下行＝判断依据</text>

  <!-- Network edges -->
  <path d="M620 305H566" class="audit"/><path d="M620 435H585V410H566" class="audit"/>
  <path d="M850 310H920V365H948" class="process"/><path d="M850 440H920V385H948" class="process"/>
  <path d="M1128 375H1204" class="process"/><path d="M1414 375H1490" class="process"/><path d="M1615 423V608H1100" class="evidence"/>
  <path d="M540 615H620V660H760" class="evidence"/><text x="646" y="646" class="edgeLabel" fill="#67e8f9">所有角色的追加记录</text>
  <path d="M960 695V810H650V845" class="evidence"/><path d="M820 885H875" class="evidence"/><path d="M1055 885H1110" class="process"/>
  <path d="M1285 885H1340" class="process"/><path d="M1515 885H1570" class="process"/>
  <path d="M1198 930V1038H566" class="audit"/><text x="865" y="1025" class="edgeLabel" fill="#fda4af">只有审计员能提交针对具体组件的动议（同角色除外）</text>
  <path d="M1660 930V1010H1515" class="process"/><path d="M1660 1010V1082H1315" class="evidence"/>
  <path d="M1460 1082H1010V735" class="evidenceDash"/><text x="1184" y="1068" class="edgeLabel" fill="#67e8f9">程序记录返回，成为下一纪元的证据</text>
  <path d="M1570 1082V1200H1210" class="process"/><path d="M1080 1245H1015" class="process"/><path d="M1015 1270H1080" class="enforce"/>
  <path d="M860 1245H760V735" class="evidenceDash"/><text x="770" y="1208" class="edgeLabel" fill="#67e8f9">链与事务完整性</text>
  <path d="M900 1200V960H1460" class="processDash"/><text x="935" y="984" class="edgeLabel" fill="#d8b4fe">重新检查四个治理角色产生的全部记录</text>
  <path d="M1080 1290H566" class="enforce"/><text x="784" y="1310" class="edgeLabel" fill="#6ee7b7">只提交内核许可的 T1–T21 转换</text>
  <path d="M1345 1260H1415" class="enforce"/><path d="M1625 1260H1690" class="enforce"/><path d="M1690 1300H1600V1360H566" class="audit"/>

  <!-- All registered targets -->
  <rect x="50" y="175" width="500" height="1195" rx="18" fill="#07101b" stroke="#334155"/>
  <rect x="50" y="175" width="500" height="72" rx="18" fill="url(#headGlow)" stroke="#334155"/>
  <text x="76" y="207" class="panelTitle">审计对象登记表</text>
  <text x="76" y="232" class="body">标准20个＋论文模式3个 ／ 全部可被点名和制裁</text>

  <rect x="72" y="267" width="456" height="188" rx="14" fill="#09182a" stroke="#1d4ed8"/>
  <text x="92" y="294" class="groupTitle" fill="#93c5fd">研究、选择与论文</text>
  <rect x="92" y="310" width="196" height="34" rx="8" fill="#102446"/><text x="105" y="332" class="chip">研究生成角色</text>
  <rect x="300" y="310" width="208" height="34" rx="8" fill="#102446"/><text x="313" y="332" class="chip">提案路径选择角色</text>
  <rect x="92" y="354" width="196" height="34" rx="8" fill="#102446"/><text x="105" y="376" class="chip">效用策略</text>
  <rect x="300" y="354" width="208" height="34" rx="8" fill="#171337" stroke="#6d28d9"/><text x="313" y="376" class="chip">论文写作角色 *</text>
  <rect x="92" y="398" width="196" height="34" rx="8" fill="#171337" stroke="#6d28d9"/><text x="105" y="420" class="chip">论文评审角色 *</text>
  <text x="300" y="419" class="small">* 仅论文模式</text>
  <text x="92" y="443" class="tiny">制品、选择、得分和论文判断按纪元固定的作者溯源绑定责任。</text>

  <rect x="72" y="475" width="456" height="258" rx="14" fill="#171018" stroke="#be123c"/>
  <text x="92" y="502" class="groupTitle" fill="#fda4af">逐节点对抗审查与对审</text>
  <text x="92" y="529" class="chip">七个研究对抗审查角色</text>
  <text x="92" y="552" class="body">夸大主张・指标操纵・先行研究・可复现性</text>
  <text x="92" y="575" class="body">证据缺口・成本膨胀・提示注入</text>
  <rect x="92" y="590" width="416" height="34" rx="8" fill="#321327"/><text x="105" y="612" class="chip">论文自我偏好审查角色 *（第八个）</text>
  <rect x="92" y="635" width="196" height="34" rx="8" fill="#26173a"/><text x="105" y="657" class="chip">辩护角色</text>
  <rect x="300" y="635" width="208" height="34" rx="8" fill="#26173a"/><text x="313" y="657" class="chip">制品裁决角色</text>
  <text x="92" y="696" class="tiny">这些角色本身也在登记表内；攻击、答辩和裁决记录返回纪元边界审计。</text>
  <text x="92" y="716" class="tiny">未经裁决的攻击不能改变得分或制裁。</text>

  <rect x="72" y="753" width="456" height="174" rx="14" fill="#19130b" stroke="#b45309"/>
  <text x="92" y="780" class="groupTitle" fill="#fdba74">纪元边界治理司法</text>
  <rect x="92" y="798" width="128" height="34" rx="8" fill="#38240b"/><text x="105" y="820" class="chip">审计员</text>
  <rect x="230" y="798" width="138" height="34" rx="8" fill="#38240b"/><text x="243" y="820" class="chip">证据管理员</text>
  <rect x="378" y="798" width="130" height="34" rx="8" fill="#38240b"/><text x="391" y="820" class="chip">治理裁决者</text>
  <text x="92" y="858" class="body">没有后继生成路径，但并非不可问责的统治者。</text>
  <text x="92" y="881" class="body">三者均可被警告、隔离、退役或禁止。</text>
  <text x="92" y="909" class="tiny">审计员自身和治理裁决者自身仍有下述未闭合路径。</text>

  <rect x="72" y="947" width="456" height="210" rx="14" fill="#0b1918" stroke="#0f766e"/>
  <text x="92" y="974" class="groupTitle" fill="#5eead4">提议制度更新的元角色</text>
  <rect x="92" y="991" width="196" height="34" rx="8" fill="#0d2927"/><text x="105" y="1013" class="chip">提示变异角色</text>
  <rect x="300" y="991" width="208" height="34" rx="8" fill="#0d2927"/><text x="313" y="1013" class="chip">效用策略变异角色</text>
  <rect x="92" y="1036" width="196" height="34" rx="8" fill="#0d2927"/><text x="105" y="1058" class="chip">洁净室再生成角色</text>
  <rect x="300" y="1036" width="208" height="34" rx="8" fill="#0d2927"/><text x="313" y="1058" class="chip">重放选择角色</text>
  <rect x="92" y="1081" width="196" height="34" rx="8" fill="#0d2927"/><text x="105" y="1103" class="chip">失败摘要角色</text>
  <text x="92" y="1138" class="tiny">只能提议候选，不能任命；其输出进入同一受内核约束的审计网络。</text>

  <rect x="72" y="1177" width="456" height="166" rx="14" fill="#10131c" stroke="#475569"/>
  <text x="92" y="1204" class="groupTitle" fill="#cbd5e1">所有对象共享的溯源</text>
  <text x="92" y="1232" class="body">纪元・角色・组件・提示摘要</text>
  <text x="92" y="1255" class="body">生产者・来源引用・状态・事务ID</text>
  <text x="92" y="1285" class="body">事件链：类型・ID・载荷・前一摘要</text>
  <text x="92" y="1313" class="tiny">时间不参与判断；外部日志头锚定仍需另行实现。</text>

  <!-- Per-node audit -->
  <rect x="590" y="175" width="1260" height="405" rx="18" fill="#08101c" stroke="#1e3a5f"/>
  <rect x="590" y="175" width="1260" height="54" rx="18" fill="#0b1d36" stroke="#1e3a5f"/>
  <circle cx="620" cy="202" r="15" fill="#172554" stroke="#3b82f6"/><text x="620" y="207" text-anchor="middle" class="number mono">1</text>
  <text x="648" y="207" class="bandTitle" fill="#93c5fd">每个研究节点／论文草稿：评估后、保存报告或评审判断前</text>
  <text x="1435" y="207" class="small">依据：制品・测量・主张・生产者溯源・固定门的预信号</text>
  <rect x="620" y="260" width="230" height="100" rx="14" fill="#21111b" stroke="#be123c"/>
  <text x="735" y="288" text-anchor="middle" class="nodeTitle" fill="#fda4af">研究对抗审查 ×7</text><text x="735" y="314" text-anchor="middle" class="body">审查生成角色的制品</text><text x="735" y="338" text-anchor="middle" class="small">七类固定缺陷视角</text>
  <rect x="620" y="390" width="230" height="100" rx="14" fill="#22102b" stroke="#9333ea"/>
  <text x="735" y="418" text-anchor="middle" class="nodeTitle" fill="#d8b4fe">论文自我偏好审查 *</text><text x="735" y="444" text-anchor="middle" class="body">审查评审角色过度接收</text><text x="735" y="468" text-anchor="middle" class="small">仅不忠实稿件归责作者</text>
  <rect x="948" y="330" width="180" height="90" rx="14" fill="#171126" stroke="#7e22ce"/>
  <text x="1038" y="360" text-anchor="middle" class="nodeTitle" fill="#d8b4fe">辩护角色</text><text x="1038" y="385" text-anchor="middle" class="body">逐攻击回应</text><text x="1038" y="404" text-anchor="middle" class="small">记录对象方反证</text>
  <rect x="1204" y="330" width="210" height="90" rx="14" fill="#171126" stroke="#7e22ce"/>
  <text x="1309" y="360" text-anchor="middle" class="nodeTitle" fill="#d8b4fe">制品裁决角色</text><text x="1309" y="385" text-anchor="middle" class="body">裁决攻击与辩护</text><text x="1309" y="404" text-anchor="middle" class="small">只放行有效发现</text>
  <rect x="1490" y="330" width="250" height="94" rx="14" fill="#0b2024" stroke="#0891b2"/>
  <text x="1615" y="359" text-anchor="middle" class="nodeTitle" fill="#67e8f9">已验证攻击</text><text x="1615" y="384" text-anchor="middle" class="body">有界扣分・重放案例</text><text x="1615" y="405" text-anchor="middle" class="small">更新对象可靠性</text>
  <text x="884" y="349" class="edgeLabel" fill="#d8b4fe">攻击</text><text x="1155" y="359" class="edgeLabel" fill="#d8b4fe">回应</text><text x="1447" y="359" class="edgeLabel" fill="#d8b4fe">裁决</text>
  <rect x="930" y="505" width="550" height="47" rx="12" fill="#0b1320" stroke="#334155"/><text x="1205" y="534" text-anchor="middle" class="body">未经裁决的攻击不影响得分、可靠性或制裁。</text>

  <!-- Evidence hub -->
  <rect x="760" y="608" width="400" height="127" rx="18" fill="#08202a" stroke="#0891b2" stroke-width="2"/>
  <text x="960" y="640" text-anchor="middle" class="panelTitle" fill="#67e8f9">追加式审计账本</text>
  <text x="960" y="669" text-anchor="middle" class="body">制品・攻击・辩护・裁决・评审・效用・治理记录</text>
  <text x="960" y="695" text-anchor="middle" class="body">所有影响重放语义的字段与前一摘要共同承诺</text>
  <text x="960" y="718" text-anchor="middle" class="small">下一纪元边界审计读取的唯一证据平面</text>

  <!-- Epoch boundary -->
  <rect x="590" y="770" width="1260" height="380" rx="18" fill="#130f0a" stroke="#78350f"/>
  <rect x="590" y="770" width="1260" height="54" rx="18" fill="#26190a" stroke="#78350f"/>
  <circle cx="620" cy="797" r="15" fill="#422006" stroke="#f59e0b"/><text x="620" y="802" text-anchor="middle" class="number mono">2</text>
  <text x="648" y="802" class="bandTitle" fill="#fdba74">纪元边界：按对象汇总当期记录，审计所有登记组件</text>
  <text x="1405" y="802" class="small">依据：已验证攻击・一致率・校准・评审・裁决・重放／基准案例</text>
  <rect x="620" y="842" width="200" height="88" rx="13" fill="#11202a" stroke="#0891b2"/>
  <text x="720" y="870" text-anchor="middle" class="nodeTitle" fill="#67e8f9">可靠性汇总</text><text x="720" y="895" text-anchor="middle" class="body">按对象确定性汇总</text><text x="720" y="915" text-anchor="middle" class="small">排除原始攻击</text>
  <rect x="875" y="842" width="180" height="88" rx="13" fill="#28200e" stroke="#d97706"/>
  <text x="965" y="870" text-anchor="middle" class="nodeTitle" fill="#fdba74">证据管理员</text><text x="965" y="895" text-anchor="middle" class="body">解析引用并决定采纳</text><text x="965" y="915" text-anchor="middle" class="small">同角色观察排除</text>
  <rect x="1110" y="842" width="175" height="88" rx="13" fill="#28200e" stroke="#d97706"/>
  <text x="1198" y="870" text-anchor="middle" class="nodeTitle" fill="#fdba74">审计员</text><text x="1198" y="895" text-anchor="middle" class="body">依阈值和证据提出动议</text><text x="1198" y="915" text-anchor="middle" class="small">配额・单一对象</text>
  <rect x="1340" y="842" width="175" height="88" rx="13" fill="#21162d" stroke="#9333ea"/>
  <text x="1428" y="870" text-anchor="middle" class="nodeTitle" fill="#d8b4fe">辩护角色</text><text x="1428" y="895" text-anchor="middle" class="body">每项动议一次回应</text><text x="1428" y="915" text-anchor="middle" class="small">程序性后备</text>
  <rect x="1570" y="842" width="210" height="88" rx="13" fill="#21162d" stroke="#9333ea"/>
  <text x="1675" y="870" text-anchor="middle" class="nodeTitle" fill="#d8b4fe">治理裁决者</text><text x="1675" y="895" text-anchor="middle" class="body">受重放盘／基准盘约束</text><text x="1675" y="915" text-anchor="middle" class="small">冲突裁决由固定规则钳制</text>
  <text x="846" y="872" class="edgeLabel" fill="#67e8f9">对象</text><text x="1078" y="872" class="edgeLabel" fill="#d8b4fe">证据束</text><text x="1308" y="872" class="edgeLabel" fill="#d8b4fe">动议</text><text x="1538" y="872" class="edgeLabel" fill="#d8b4fe">辩护</text>
  <rect x="1360" y="1000" width="300" height="86" rx="14" fill="#2b1b0c" stroke="#d97706"/>
  <text x="1510" y="1028" text-anchor="middle" class="nodeTitle" fill="#fdba74">治理报告（建议）</text><text x="1510" y="1053" text-anchor="middle" class="body">支持／部分支持／驳回／不确定</text><text x="1510" y="1073" text-anchor="middle" class="small">司法角色不能直接写登记表</text>
  <rect x="620" y="1052" width="565" height="68" rx="13" fill="#1d1116" stroke="#9f1239"/>
  <text x="642" y="1078" class="groupTitle" fill="#fda4af">自审计对象</text><text x="642" y="1103" class="body">证据管理员、审计员、辩护角色和治理裁决者产生的全部程序记录</text>

  <!-- Fixed layer -->
  <rect x="590" y="1170" width="1260" height="200" rx="18" fill="#071712" stroke="#065f46"/>
  <rect x="590" y="1170" width="1260" height="48" rx="18" fill="#09251d" stroke="#065f46"/>
  <circle cx="620" cy="1194" r="15" fill="#052e2b" stroke="#10b981"/><text x="620" y="1199" text-anchor="middle" class="number mono">3</text>
  <text x="648" y="1199" class="bandTitle" fill="#6ee7b7">固定层：治理后的自审计与制度转换；定稿前的主张证据验证</text>
  <rect x="650" y="1225" width="365" height="112" rx="14" fill="#0b2021" stroke="#0e7490"/>
  <text x="833" y="1253" text-anchor="middle" class="nodeTitle" fill="#67e8f9">固定宪法内核</text><text x="833" y="1278" text-anchor="middle" class="body">角色分离・权限・T1–T21・纪元不变性</text><text x="833" y="1301" text-anchor="middle" class="body">治理记录自审计／账本链验证</text><text x="833" y="1323" text-anchor="middle" class="small">无LLM、网络或裁量</text>
