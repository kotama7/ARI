<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="PromptSpec lifecycle state machine: validation pipeline from candidate to shadow, adoption into probationary_active and active, sanction ladder to banned, and the clean-room re-entry path">
  <defs>
    <marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="parrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="parrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
    <marker id="parrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #334155; }
    .t { font-size: 11px; font-weight: 600; fill: #475569; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
    .edgeG { stroke: #059669; stroke-width: 1.4; fill: none; }
    .edgeR { stroke: #e11d48; stroke-width: 1.5; fill: none; }
    .edgeI { stroke: #4f46e5; stroke-width: 1.5; fill: none; }
  </style>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" class="title">PromptSpec lifecycle — validation pipeline, adoption, sanctions</text>

  <text x="200" y="70" text-anchor="middle" class="b" fill="#4f46e5">Six-stage validation (candidates only)</text>
  <text x="700" y="70" text-anchor="middle" class="b" fill="#059669">Governed statuses (RTE writes only)</text>

  <!-- pipeline -->
  <rect x="70" y="84" width="260" height="40" rx="7" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="200" y="102" text-anchor="middle" class="b">candidate</text>
  <text x="200" y="117" text-anchor="middle" class="s">from PromptMutator or clean room</text>
  <line x1="200" y1="124" x2="200" y2="144" class="edge" marker-end="url(#parr)"/>

  <rect x="70" y="146" width="260" height="36" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="200" y="168" text-anchor="middle" class="b">static_validation (deterministic)</text>
  <line x1="200" y1="182" x2="200" y2="202" class="edge" marker-end="url(#parr)"/>

  <rect x="70" y="204" width="260" height="36" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="200" y="226" text-anchor="middle" class="b">constitutional_validation (deterministic)</text>
  <line x1="200" y1="240" x2="200" y2="260" class="edge" marker-end="url(#parr)"/>

  <rect x="70" y="262" width="260" height="36" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="200" y="284" text-anchor="middle" class="b">schema_dry_run (1 LLM call)</text>
  <path d="M 330 280 L 362 280" class="edge" marker-end="url(#parr)"/>
  <rect x="364" y="262" width="106" height="36" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.3"/>
  <text x="417" y="279" text-anchor="middle" class="s" fill="#be123c">failure is</text>
  <text x="417" y="293" text-anchor="middle" class="s" fill="#be123c">terminal</text>
  <line x1="200" y1="298" x2="200" y2="318" class="edge" marker-end="url(#parr)"/>

  <rect x="70" y="320" width="260" height="36" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="200" y="336" text-anchor="middle" class="b">replay_evaluation</text>
  <text x="200" y="350" text-anchor="middle" class="s">against the AdversarialReplayPool</text>
  <line x1="200" y1="356" x2="200" y2="376" class="edge" marker-end="url(#parr)"/>

  <rect x="70" y="378" width="260" height="36" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="200" y="394" text-anchor="middle" class="b">anchor_evaluation</text>
  <text x="200" y="408" text-anchor="middle" class="s">fixed anchor set; ties favor the incumbent</text>
  <line x1="200" y1="414" x2="200" y2="434" class="edge" marker-end="url(#parr)"/>

  <rect x="70" y="436" width="260" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
  <text x="200" y="454" text-anchor="middle" class="b">shadow</text>
  <text x="200" y="469" text-anchor="middle" class="s">sampled side-by-side; observation-only</text>

  <!-- adoption arrow -->
  <path d="M 330 456 L 500 456 L 500 104 L 576 104" class="edgeG" stroke-width="1.8" marker-end="url(#parrG)"/>
  <text x="492" y="150" text-anchor="end" class="t" fill="#047857">adoption (T6):</text>
  <text x="492" y="166" text-anchor="end" class="t" fill="#047857">RTE only, at an</text>
  <text x="492" y="182" text-anchor="end" class="t" fill="#047857">epoch boundary —</text>
  <text x="492" y="198" text-anchor="end" class="t" fill="#047857">no candidate→active</text>
  <text x="492" y="214" text-anchor="end" class="t" fill="#047857">shortcut exists</text>

  <!-- status ladder -->
  <rect x="580" y="84" width="240" height="40" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="108" text-anchor="middle" class="b">probationary_active</text>
  <line x1="700" y1="124" x2="700" y2="156" class="edge" marker-end="url(#parr)"/>
  <text x="710" y="144" class="t">T7 clean probation</text>

  <rect x="580" y="158" width="240" height="40" rx="7" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="700" y="182" text-anchor="middle" class="b">active</text>
  <line x1="700" y1="198" x2="700" y2="238" class="edge" marker-end="url(#parr)"/>
  <text x="710" y="222" class="t">T9 reliability warning</text>

  <rect x="580" y="240" width="240" height="40" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="700" y="264" text-anchor="middle" class="b">warning</text>
  <line x1="700" y1="280" x2="700" y2="320" class="edge" marker-end="url(#parr)"/>
  <text x="710" y="304" class="t">T13 recurrence</text>

  <rect x="580" y="322" width="240" height="40" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="700" y="346" text-anchor="middle" class="b">probation</text>
  <line x1="700" y1="362" x2="700" y2="402" class="edge" marker-end="url(#parr)"/>
  <text x="710" y="386" class="t">T15 degradation</text>

  <rect x="580" y="404" width="240" height="40" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="700" y="428" text-anchor="middle" class="b">quarantine</text>
  <line x1="700" y1="444" x2="700" y2="484" class="edge" marker-end="url(#parr)"/>
  <text x="710" y="468" class="t">T17 confirmed retirement</text>

  <rect x="580" y="486" width="240" height="40" rx="7" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="700" y="510" text-anchor="middle" class="b">retired</text>
  <line x1="700" y1="526" x2="700" y2="566" class="edge" marker-end="url(#parr)"/>
  <text x="710" y="550" class="t">T19 contamination</text>

  <rect x="580" y="568" width="240" height="40" rx="7" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="588" text-anchor="middle" class="b">banned</text>
  <text x="700" y="602" text-anchor="middle" class="s">absorbing — no resurrection</text>

  <!-- side sanction edges (left arcs) -->
  <path d="M 580 186 C 540 186 540 334 578 338" class="edge" marker-end="url(#parr)"/>
  <text x="522" y="330" text-anchor="end" class="t">T10</text>
  <path d="M 580 178 C 522 182 522 416 578 420" class="edge" marker-end="url(#parr)"/>
  <text x="522" y="416" text-anchor="end" class="t">T11 upheld impeachment</text>

  <!-- emergency edge -->
  <path d="M 580 268 C 548 272 548 408 578 412" class="edgeR" stroke-dasharray="6 4" marker-end="url(#parrR)"/>
  <text x="548" y="376" text-anchor="end" class="t" fill="#be123c">T16 emergency —</text>
  <text x="548" y="391" text-anchor="end" class="t" fill="#be123c">forced close/open boundary</text>

  <!-- recovery edges (right arcs, dashed green) -->
  <path d="M 820 264 C 866 260 866 186 822 182" class="edgeG" stroke-dasharray="5 4" marker-end="url(#parrG)"/>
  <text x="852" y="210" class="t" fill="#047857">T12</text>
  <path d="M 820 350 C 886 344 886 190 822 176" class="edgeG" stroke-dasharray="5 4" marker-end="url(#parrG)"/>
  <text x="856" y="300" class="t" fill="#047857">T14</text>
  <path d="M 820 428 C 906 420 906 112 822 98" class="edgeG" stroke-dasharray="5 4" marker-end="url(#parrG)"/>
  <text x="876" y="380" class="t" fill="#047857">T18 exoneration</text>

  <!-- clean-room re-entry -->
  <path d="M 580 514 L 36 514 L 36 104 L 66 104" class="edgeI" stroke-dasharray="7 4" marker-end="url(#parrI)"/>
  <text x="500" y="650" text-anchor="middle" class="s" fill="#4f46e5">dashed indigo: clean-room regeneration of a retired role — a NEW candidate is generated from a kernel-screened</text>
  <text x="500" y="668" text-anchor="middle" class="s" fill="#4f46e5">input bundle (CK-CLN rules); the retired prompt text itself is a forbidden input and stays unreadable everywhere</text>
  <text x="500" y="698" text-anchor="middle" class="s">Every status write goes through the RegistryTransitionEngine against the fixed T1–T21 table; stage skipping is a constitutional violation.</text>
</svg>
