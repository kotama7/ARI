<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" role="img" aria-label="Epoch boundary pipeline with actor lanes: GovernanceOrchestrator, RegistryTransitionEngine, ConstitutionalKernel, and the checkpoint store">
  <defs>
    <marker id="barr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="barrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .lane { font-size: 14px; font-weight: 700; }
    .b { font-size: 12.5px; font-weight: 600; }
    .s { font-size: 11.5px; fill: #334155; }
    .file { font-size: 11.5px; font-style: italic; fill: #475569; }
    .edge { stroke: #475569; stroke-width: 1.5; fill: none; }
    .edgeR { stroke: #e11d48; stroke-width: 1.5; fill: none; }
  </style>

  <rect x="0" y="0" width="1000" height="940" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" class="title">Epoch boundary — who does what, and what gets written</text>

  <!-- lane backgrounds -->
  <rect x="18"  y="52" width="292" height="860" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <rect x="322" y="52" width="286" height="860" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="620" y="52" width="170" height="860" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <rect x="802" y="52" width="180" height="860" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="164" y="76" text-anchor="middle" class="lane" fill="#5b21b6">GovernanceOrchestrator</text>
  <text x="465" y="76" text-anchor="middle" class="lane" fill="#1d4ed8">RegistryTransitionEngine</text>
  <text x="705" y="76" text-anchor="middle" class="lane" fill="#be123c">ConstitutionalKernel</text>
  <text x="892" y="76" text-anchor="middle" class="lane" fill="#475569">Checkpoint store</text>

  <!-- orchestrator steps -->
  <rect x="34" y="92" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="110" text-anchor="middle" class="b">1 collect observations</text>
  <text x="164" y="125" text-anchor="middle" class="s">epoch audit-log slice + registries</text>
  <line x1="164" y1="132" x2="164" y2="146" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="148" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="166" text-anchor="middle" class="b">2 reliability assessment</text>
  <text x="164" y="181" text-anchor="middle" class="s">per-component reliability entries</text>
  <line x1="164" y1="188" x2="164" y2="202" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="204" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="222" text-anchor="middle" class="b">3 evidence assembly</text>
  <text x="164" y="237" text-anchor="middle" class="s">EvidenceClerk only; inadmissible dropped</text>
  <line x1="164" y1="244" x2="164" y2="258" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="260" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="278" text-anchor="middle" class="b">4 prosecution decision</text>
  <text x="164" y="293" text-anchor="middle" class="s">only the Auditor files motions (+ bond)</text>
  <line x1="164" y1="300" x2="164" y2="314" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="316" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="334" text-anchor="middle" class="b">5 defense generation</text>
  <text x="164" y="349" text-anchor="middle" class="s">one defense per motion (fallback total)</text>
  <line x1="164" y1="356" x2="164" y2="370" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="372" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="390" text-anchor="middle" class="b">6 adjudication panel</text>
  <text x="164" y="405" text-anchor="middle" class="s">motion outcomes + candidate evaluations</text>
  <line x1="164" y1="412" x2="164" y2="426" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="428" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="446" text-anchor="middle" class="b">7 replay-pool update</text>
  <text x="164" y="461" text-anchor="middle" class="s">admit / retire validated attack cases</text>
  <line x1="164" y1="468" x2="164" y2="482" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="484" width="260" height="40" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="164" y="502" text-anchor="middle" class="b">8 governance self-audit</text>
  <text x="164" y="517" text-anchor="middle" class="s">audits auditor / clerk / defender / judge</text>
  <line x1="164" y1="524" x2="164" y2="538" class="edge" marker-end="url(#barr)"/>

  <rect x="34" y="540" width="260" height="44" rx="7" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="164" y="559" text-anchor="middle" class="b">9 GovernanceReport (advisory)</text>
  <text x="164" y="575" text-anchor="middle" class="s">recommendations, never registry writes</text>

  <!-- report to store -->
  <path d="M 294 562 L 806 562" class="edge" stroke-dasharray="5 4" marker-end="url(#barr)"/>
  <rect x="812" y="530" width="160" height="40" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="892" y="548" text-anchor="middle" class="file">rqgm_audit.jsonl</text>
  <text x="892" y="563" text-anchor="middle" class="s">hash-chained events</text>

  <!-- report to RTE -->
  <path d="M 164 584 L 164 616 L 330 616" class="edge" marker-end="url(#barr)"/>

  <!-- RTE resolve -->
  <rect x="336" y="592" width="258" height="48" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="465" y="612" text-anchor="middle" class="b">resolve_transition — pure T1–T21</text>
  <text x="465" y="628" text-anchor="middle" class="s">adoptions / sanctions / retirements</text>

  <!-- resolve to kernel -->
  <path d="M 594 616 L 626 616" class="edge" marker-end="url(#barr)"/>
  <rect x="632" y="586" width="146" height="60" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4"/>
  <text x="705" y="606" text-anchor="middle" class="b">validate transition</text>
  <text x="705" y="622" text-anchor="middle" class="s">CK-REG-001/002</text>
  <text x="705" y="637" text-anchor="middle" class="s">CK-ROL-901</text>

  <!-- kernel verdicts -->
  <path d="M 668 646 L 668 672 L 594 672" class="edge" marker-end="url(#barr)"/>
  <text x="676" y="666" class="s" fill="#166534">pass</text>
  <path d="M 742 646 L 742 692" class="edgeR" stroke-dasharray="5 4" marker-end="url(#barrR)"/>
  <text x="705" y="710" text-anchor="middle" class="s" fill="#be123c">block ⇒ incumbent set</text>
  <text x="705" y="725" text-anchor="middle" class="s" fill="#be123c">carries over; the run</text>
  <text x="705" y="740" text-anchor="middle" class="s" fill="#be123c">continues (never aborts)</text>

  <!-- RTE transaction -->
  <rect x="336" y="656" width="258" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="465" y="676" text-anchor="middle" class="b">boundary transaction</text>
  <text x="465" y="692" text-anchor="middle" class="s">prepare → epoch_close → epoch_open</text>
  <text x="465" y="707" text-anchor="middle" class="s">→ commit (idempotent, resume-safe)</text>

  <path d="M 594 686 L 806 686" class="edge" stroke-dasharray="5 4" marker-end="url(#barr)"/>
  <rect x="812" y="646" width="160" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="892" y="665" text-anchor="middle" class="file">rqgm_transitions.jsonl</text>
  <text x="892" y="681" text-anchor="middle" class="s">4-event quadruple, then</text>
  <text x="892" y="696" text-anchor="middle" class="file">epoch_state.json</text>
  <text x="892" y="712" text-anchor="middle" class="file">rqgm_registry.json</text>

  <!-- frontier repair -->
  <path d="M 465 716 L 465 744" class="edge" marker-end="url(#barr)"/>
  <rect x="336" y="746" width="258" height="64" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="465" y="766" text-anchor="middle" class="b">frontier repair (on retirements)</text>
  <text x="465" y="782" text-anchor="middle" class="s">dependency closure from retired hashes;</text>
  <text x="465" y="797" text-anchor="middle" class="s">LOGICAL-only erasure, frontier rebuild</text>

  <path d="M 594 778 L 806 778" class="edge" stroke-dasharray="5 4" marker-end="url(#barr)"/>
  <rect x="812" y="750" width="160" height="58" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="892" y="769" text-anchor="middle" class="s">erasure/rebuild events;</text>
  <text x="892" y="784" text-anchor="middle" class="s">stale flags in tree.json</text>
  <text x="892" y="800" text-anchor="middle" class="file">rqgm_erasure_state.json</text>

  <!-- clean room -->
  <path d="M 465 810 L 465 838" class="edge" marker-end="url(#barr)"/>
  <rect x="336" y="840" width="258" height="60" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="465" y="860" text-anchor="middle" class="b">clean-room regeneration</text>
  <text x="465" y="876" text-anchor="middle" class="s">replacement candidates for retired roles;</text>
  <text x="465" y="891" text-anchor="middle" class="s">kernel CK-CLN screens; next-cycle entry</text>

  <!-- kernel note -->
  <rect x="632" y="760" width="146" height="120" rx="7" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="705" y="782" text-anchor="middle" class="s">deterministic,</text>
  <text x="705" y="798" text-anchor="middle" class="s">non-LLM rule tables</text>
  <text x="705" y="814" text-anchor="middle" class="s">frozen in code;</text>
  <text x="705" y="830" text-anchor="middle" class="s">judge roles can never</text>
  <text x="705" y="846" text-anchor="middle" class="s">write the registry;</text>
  <text x="705" y="862" text-anchor="middle" class="s">emergency quarantine is</text>
  <text x="705" y="878" text-anchor="middle" class="s">the only mid-epoch edge</text>
</svg>
