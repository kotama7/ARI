<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1290" role="img" aria-label="Lifecycle of one ari_rqgm run from boot to the next epoch">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 12px; fill: #334155; }
    .lbl { font-size: 12px; font-weight: 600; fill: #475569; }
    .file { font-size: 11.5px; font-style: italic; fill: #64748b; }
    .edge { stroke: #475569; stroke-width: 1.6; fill: none; }
    .edgep { stroke: #7c3aed; stroke-width: 1.6; fill: none; }
  </style>

  <rect x="0" y="0" width="800" height="1290" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" class="title">One ari_rqgm run — boot to next epoch</text>

  <!-- boot -->
  <rect x="140" y="56" width="500" height="58" rx="8" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="80" text-anchor="middle" class="h">ari run — boot &amp; mode resolution</text>
  <text x="390" y="100" text-anchor="middle" class="s">ari.mode + rqgm.enabled must agree (env: ARI_MODE / ARI_RQGM_ENABLED)</text>

  <line x1="390" y1="114" x2="390" y2="140" class="edge" marker-end="url(#arr)"/>

  <!-- runtime -->
  <rect x="120" y="142" width="540" height="58" rx="8" fill="#eef2f7" stroke="#64748b" stroke-width="1.5"/>
  <text x="390" y="166" text-anchor="middle" class="h">RQGMRuntime constructed (ari_rqgm only)</text>
  <text x="390" y="186" text-anchor="middle" class="s">writes rqgm_state.json, copies constitution.yaml — simple_bfts imports no ari.rqgm</text>

  <line x1="390" y1="200" x2="390" y2="226" class="edge" marker-end="url(#arr)"/>

  <!-- founding -->
  <rect x="110" y="228" width="560" height="76" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="390" y="252" text-anchor="middle" class="h">Founding registration — one transaction</text>
  <text x="390" y="272" text-anchor="middle" class="s">prepare → 29 prompt_registered + 16 component_registered → commit</text>
  <text x="390" y="292" text-anchor="middle" class="file">rqgm_transitions.jsonl (write-once; replayed on resume) → rqgm_registry.json</text>

  <line x1="390" y1="304" x2="390" y2="330" class="edge" marker-end="url(#arr)"/>

  <!-- epoch open -->
  <rect x="140" y="332" width="500" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="356" text-anchor="middle" class="h">epoch_000 opens — founding active set frozen</text>
  <text x="390" y="376" text-anchor="middle" class="s">active_components + active_prompt_hashes pinned in epoch_state.json</text>

  <line x1="390" y1="390" x2="390" y2="416" class="edge" marker-end="url(#arr)"/>

  <!-- per-node loop -->
  <rect x="60" y="418" width="660" height="352" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="390" y="444" text-anchor="middle" class="h" fill="#065f46">Per-node loop (BFTS unchanged)</text>

  <rect x="100" y="458" width="580" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="480" text-anchor="middle" class="h">ProposalRouter → ProposalRecord (archived)</text>
  <text x="390" y="500" text-anchor="middle" class="s">BFTS only ever sees the capped ProposalSummaryView</text>

  <line x1="390" y1="514" x2="390" y2="534" class="edge" marker-end="url(#arr)"/>

  <rect x="100" y="536" width="580" height="42" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="562" text-anchor="middle" class="h">node executes (agent loop — never vetoed by governance)</text>

  <line x1="390" y1="578" x2="390" y2="598" class="edge" marker-end="url(#arr)"/>

  <rect x="100" y="600" width="580" height="52" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="622" text-anchor="middle" class="h">governance level ladder → L0…L3 + triggers</text>
  <text x="390" y="641" text-anchor="middle" class="file">governance_level event in rqgm_audit.jsonl</text>

  <line x1="390" y1="652" x2="390" y2="672" class="edge" marker-end="url(#arr)"/>

  <rect x="100" y="674" width="580" height="74" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="696" text-anchor="middle" class="h">adversarial round (event-driven: top-k / score jump / paper candidate)</text>
  <text x="390" y="715" text-anchor="middle" class="s">attack artifacts → defend → judge → ValidatedAttackRecord → bounded penalty</text>
  <text x="390" y="734" text-anchor="middle" class="file">rqgm_adversarial_cases.jsonl + replay pool (raw attacks are score-inert)</text>

  <!-- loop-back arrow -->
  <path d="M 680 711 L 706 711 L 706 486 L 682 486" class="edge" marker-end="url(#arr)"/>
  <text x="750" y="600" text-anchor="middle" class="lbl">next</text>
  <text x="750" y="616" text-anchor="middle" class="lbl">node</text>

  <line x1="390" y1="770" x2="390" y2="808" class="edgep" marker-end="url(#arrv)"/>
  <text x="402" y="786" class="lbl" fill="#7c3aed">nodes_per_epoch new nodes</text>
  <text x="402" y="802" class="lbl" fill="#7c3aed">(loop-head tick + end-of-run flush)</text>

  <!-- boundary -->
  <rect x="60" y="810" width="660" height="330" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="390" y="836" text-anchor="middle" class="h" fill="#5b21b6">Epoch boundary (main thread, no node in flight)</text>

  <rect x="100" y="850" width="580" height="52" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="872" text-anchor="middle" class="h">GovernanceOrchestrator.audit_epoch → GovernanceReport</text>
  <text x="390" y="891" text-anchor="middle" class="s">nine steps: observe … self-audit (advisory; appended to rqgm_audit.jsonl)</text>

  <line x1="390" y1="902" x2="390" y2="920" class="edge" marker-end="url(#arr)"/>

  <rect x="100" y="922" width="580" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="947" text-anchor="middle" class="h">meta-evolution step — candidates only, kernel-gated</text>

  <line x1="390" y1="962" x2="390" y2="980" class="edge" marker-end="url(#arr)"/>

  <rect x="100" y="982" width="580" height="52" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="390" y="1004" text-anchor="middle" class="h">RegistryTransitionEngine resolves (T1–T21) → kernel validates</text>
  <text x="390" y="1023" text-anchor="middle" class="s">blocked transition ⇒ incumbent active set carries over; the run continues</text>

  <line x1="390" y1="1034" x2="390" y2="1052" class="edge" marker-end="url(#arr)"/>

  <rect x="100" y="1054" width="580" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="1076" text-anchor="middle" class="h">boundary transaction: prepare → epoch_close → epoch_open → commit</text>
  <text x="390" y="1095" text-anchor="middle" class="s">then frontier repair on retirements (logical erasure, frontier rebuild)</text>
  <text x="390" y="1114" text-anchor="middle" class="s">and clean-room regeneration requests for retired roles</text>

  <line x1="390" y1="1140" x2="390" y2="1166" class="edge" marker-end="url(#arr)"/>

  <!-- next epoch -->
  <rect x="140" y="1168" width="500" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="1192" text-anchor="middle" class="h">epoch_001 opens — next active set frozen</text>
  <text x="390" y="1212" text-anchor="middle" class="s">search resumes under the new frozen institution</text>

  <path d="M 640 1197 L 782 1197 L 782 486 L 724 486" class="edge" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="390" y="1258" text-anchor="middle" class="file">dashed: the cycle repeats every nodes_per_epoch nodes until the run ends</text>
</svg>
