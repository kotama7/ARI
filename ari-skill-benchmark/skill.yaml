schema_version: 1
name: benchmark-skill
package: ari-skill-benchmark
version: 0.1.0
display_name: Analyze experiment results
description: Deterministic experiment analysis, visualization, and statistical testing.
entrypoint:
  transport: stdio
  command_kind: python
  module: src/server.py
required_env: []
optional_env: []
tool_defaults:
  phases: [bfts]
  side_effects: read-only
  determinism: deterministic
  timeout_class: bounded
  permissions: [workspace-read]
  result_schema: ari.legacy-mcp-result/v1
tools:
  - name: analyze_results
    capability_ref: ari.analysis.results
  - name: plot
    capability_ref: ari.visualization.metrics
    side_effects: workspace-write
    permissions: [workspace-read, workspace-write]
  - name: statistical_test
    capability_ref: ari.analysis.statistics
