[project]
name = "ari-skill-vlm"
version = "0.2.0"
description = "VLM-based figure and table review for papers"
requires-python = ">=3.13"
dependencies = [
    "ari-core>=0.9.1",
    "mcp>=1.0",
    "litellm>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

pythonpath = ["."]
