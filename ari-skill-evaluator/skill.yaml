schema_version: 1
name: evaluator-skill
package: ari-skill-evaluator
version: 1.1.0
display_name: Evaluate scientific evidence
description: Metric contracts, deterministic claim gates, and evidence-grounded semantic review.
environment_policy: complete
entrypoint:
  transport: stdio
  command_kind: python
  module: src/server.py
required_env: []
optional_env:
  - ARI_BACKEND
  - ARI_CHECKPOINT_DIR
  - ARI_CLAIM_GATE_MODE
  - ARI_LLM_API_BASE
  - ARI_LLM_MODEL
  - ARI_MODEL_METRIC_PROPOSAL
  - ARI_MODEL_SEMANTIC_REVIEW
  - ARI_SEMANTIC_REVIEW_MODEL_REVISION
  - AWS_DEFAULT_REGION
  - AWS_REGION
  - AZURE_API_BASE
  - AZURE_API_VERSION
  - OLLAMA_HOST
  - VERTEXAI_LOCATION
  - VERTEXAI_PROJECT
credential_scopes:
  - id: model.provider
    optional_env:
      - ANTHROPIC_API_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AZURE_API_KEY
      - AZURE_OPENAI_API_KEY
      - COHERE_API_KEY
      - DATABRICKS_API_TOKEN
      - DEEPINFRA_API_KEY
      - DEEPSEEK_API_KEY
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - GROQ_API_KEY
      - MISTRAL_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - REPLICATE_API_TOKEN
      - TOGETHERAI_API_KEY
      - VERTEXAI_CREDENTIALS
      - WATSONX_APIKEY
      - XAI_API_KEY
tool_defaults:
  phases: [bfts, paper]
  side_effects: read-only
  determinism: conditional
  timeout_class: slow
  permissions: [workspace-read, model]
  result_schema: ari.result-envelope/v1
tools:
  - name: claim_evidence_hard_gate
    capability_ref: ari.evaluation.claim-gate
    determinism: deterministic
    timeout_class: bounded
    side_effects: stateful
    permissions: [workspace-read, workspace-write]
  - name: evidence_grounded_semantic_review
    capability_ref: ari.evaluation.semantic-review
    side_effects: stateful
    permissions: [workspace-read, workspace-write, model]
  - name: make_metric_spec
    capability_ref: ari.evaluation.metric-spec
    phases: [bfts]
    determinism: deterministic
    side_effects: stateful
    permissions: [workspace-read, workspace-write]
  - name: propose_metric_contract
    capability_ref: ari.evaluation.metric-proposal
    phases: [bfts]
    side_effects: stateful
    determinism: stochastic
    permissions: [workspace-read, workspace-write, model]
