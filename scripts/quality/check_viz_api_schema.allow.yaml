  # ── server-only by design until Wave 2b: /api/v1 (gui_refresh Wave 2a) ────
  # The single startswith('/api/v1/') delegation branch in routes.py is this
  # checker's canonical identity for the whole versioned surface; the real
  # dispatch is the declarative table in ari/viz/v1/router.py serving
  # GET /api/v1/projects, /projects/{project_id}/runs, /runs/{run_id},
  # /runs/{run_id}/summary, /runs/{run_id}/tree (ADR-02/ADR-08), plus the
  # Wave 3a additions /secrets/status (ADR-11) and /config/schema (task 05
  # canonical field registry). services/api.ts intentionally does not call it
  # yet — the frontend adopts the OpenAPI-generated v1 client in gui_refresh
  # Wave 2b (plan 04 §Compatibility and migration step 4), at which point
  # these become matched, not drift.
  - id: "GET /api/v1/{id}"
    note: "gui_refresh Wave 2a /api/v1 read-only platform (ADR-02/ADR-08); server-only until the Wave 4 Studio UI adopts the generated v1 client (the typed client lives in services/api/v1.ts, which this checker's api.ts extraction does not scan — the Wave 4d Studio consumes it from there). Dispatch: ari/viz/v1/router.py (Wave 2a/3a GET resources incl. secrets/status + config/schema + runs/{run_id}/resolved-config, plus the Wave 3b config-document GETs: projects/{project_id}/config, run-templates[/{template_id}], run-drafts/{draft_id}, plus the Wave 4a/4b task-08 RQGM read block runs/{run_id}/rqgm/{capabilities,overview,registry,transitions,audit,policies,score-rewrites,nodes/{node_id}/lineage,epochs[/{epoch_id}],evolution,paper-archive} — GET-only by plan 08, server-only until the RQGM Workspace Tabs stage adopts the v1 client; plus the Wave 4c idea read model runs/{run_id}/idea — pure {ckpt}/idea.json read, absent file => present=false; plus the task 06 Wave 4d model catalog config/catalogs/models — the legacy /api/models suggestions re-served single-source with per-provider env-key names, ADR-05; plus the task 09 Wave 5b operational diagnostics /api/v1/diagnostics — bounded scalars only (MN-9, plan 09 §Operational visibility), builder ari/viz/health.py, ARI_GUI_HEALTH=0 answers the typed 404; plus the task 07 tail cursor log explorer runs/{run_id}/logs — bounded byte-offset pagination over {ckpt}/ari.log (reader ari/viz/v1/logs.py; raw-byte cursor stable under the grep filter, committed lines only, <= 1 MiB scanned per request, absent file => present=false), consumed by the Overview LogsPanel through services/api/v1.ts which this checker's api.ts extraction does not scan)."
  - id: "POST /api/v1/{id}"
    note: "gui_refresh Wave 3b (task 05) config CRUD mutations (ADR-12 gui_store; If-Match optimistic concurrency): POST /api/v1/run-templates (create-only, 409 already_exists) + POST /api/v1/run-drafts (server-generated draft id) + the new-run preview POSTs /api/v1/run-drafts/{draft_id}/resolve-config and /validate (resolver: ari/config/resolver.py resolve_new_run_config). PATCH/DELETE siblings ride do_PATCH/do_DELETE, and the task 06 Wave 4d ADR-05 secret assignment PUT /api/v1/secrets/{secret_id} rides do_PUT — none of which this checker extracts. Server-only until the Wave 4 Studio UI lands the generated v1 client."
  - id: "GET /api/v1/events/stream/{id}"
    note: "gui_refresh Wave 2b /api/v1 SSE realtime stream (ADR-03); dedicated routes.py branch before the v1 JSON delegation (bus: ari/viz/v1/events.py). Server-only until the Wave 2b realtime stage lands the EventSource client."

  # ── server-only by design: operational health probes (task 09 Wave 5b) ────
  - id: "GET /health/live|/health/ready"
    note: "gui_refresh task 09 Wave 5b (MN-9, plan 09 §Operational visibility): liveness/readiness probes for operators/orchestrators (curl, systemd, k8s-style probes, reverse-proxy health checks) — deliberately NOT called by services/api.ts, so permanently server-only. Auth-exempt via the MN-8 /health prefix exemption; payload builders + ARI_GUI_HEALTH kill-switch register in ari/viz/health.py; behavior pinned by ari-core/tests/test_gui_health_diagnostics.py. The sibling GET /api/v1/diagnostics rides the /api/v1 delegation branch (see GET /api/v1/{id})."
