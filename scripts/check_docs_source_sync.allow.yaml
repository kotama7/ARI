# Frozen baseline for scripts/check_docs_source_sync.py (subtask 027).
#
# Each entry is a (doc, source) pair whose source had a commit on main more
# recent than the doc's last_verified at freeze time -- i.e. pre-existing,
# already-merged trunk-state staleness. Listing a pair here reports it as
# "known" (never fails a non-warning-only run); only NEW staleness ratchets.
# A suppression is NOT a fix: while a pair sits here, that doc going stale
# against that source again is invisible to the ratchet.
#
# EMPTY, and that is the earned state rather than a disabled check.
#
# The 2026-07-02 baseline listed 82 pairs across 38 documents, with a standing
# instruction not to clear them by bumping last_verified, because moving a date
# without reading the source is how a freshness field stops meaning anything.
# They were cleared the other way, on 2026-08-16: each of those documents was
# read against every source it declares, statement by statement, and the
# corrections that fell out were made before any date moved. 81 of the 38
# documents' 82 pairs now carry `last_verified: 2026-08-16` and were closed by
# that reading; the remaining one, docs/guides/troubleshooting.md against
# ari-core/ari/paths.py, had already closed on 2026-08-08 -- and closed by a
# single day, since the checker compares with a strict `>`.
#
# So `check_docs_source_sync.py` now reports {total: 0, new: 0, known: 0} on a
# clean tree, and the whole surface -- not just the un-suppressed part of it --
# is under the ratchet.
#
# ADDING AN ENTRY BACK is a deliberate act with a cost: it exempts one pair from
# the only check that notices a doc drifting from its own declared sources. Do it
# when a source is committed that a doc genuinely cannot be re-read against yet,
# say why in `note`, and treat it as debt. Bumping `last_verified` instead is
# worse: an entry here is at least visible.
#
# Cleared: 2026-08-16. Previously frozen: 2026-07-02.
known-offenders: []
